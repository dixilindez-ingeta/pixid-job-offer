services:
  postgres:
    image: postgres:17
    container_name: job-offer-postgres
    environment:
      POSTGRES_DB: job_offer
      POSTGRES_USER: super_jobber
      POSTGRES_PASSWORD: my_secret
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U super_jobber -d job_offer" ]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: job-offer-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/job_offer
      SPRING_DATASOURCE_USERNAME: super_jobber
      SPRING_DATASOURCE_PASSWORD: my_secret
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "8486:8486"
    labels:
      # ./mvnw spring-boot:run must not create a service connection for this container
      org.springframework.boot.ignore: "true"

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:17
    container_name: job-offer-postgres
    environment:
      POSTGRES_DB: job_offer
      POSTGRES_USER: super_jobber
      POSTGRES_PASSWORD: my_secret
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U super_jobber -d job_offer" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

server:
  port: 8486

spring:
  application:
    name: job-offer-service
  datasource:
    url: jdbc:postgresql://localhost:5434/job_offer
    username: super_jobber
    password: my_secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
  docker:
    compose:
      # dev mode (./mvnw spring-boot:run): only the database, the app runs on the host
      start:
        arguments: postgres
      stop:
        arguments: postgres
  web:
    locale: en
    locale-resolver: fixed
  flyway:
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html